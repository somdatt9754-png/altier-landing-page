<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>पैक बदलें — Altier Crop Science</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:#f2f4f7;color:#16202c;line-height:1.55}
.top{background:#1e3a5f;color:#fff;padding:16px 18px;text-align:center}
.top .brand{font-size:15px;letter-spacing:.14em;font-weight:700}
.top .sub{font-size:12px;opacity:.8;margin-top:3px}
.wrap{max-width:460px;margin:0 auto;padding:16px 14px 34px}
.card{background:#fff;border-radius:14px;padding:18px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(16,32,48,.09)}
.hi{font-size:17px;font-weight:700;margin:0 0 4px}
.small{font-size:13px;color:#5b6b7c}
.orderbox{background:#f6f9fc;border:1px solid #e2eaf2;border-radius:11px;padding:13px 14px;margin-top:13px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
.row .k{color:#5b6b7c}
.row .v{font-weight:600;text-align:right}
.amount{font-size:19px;font-weight:800;color:#0d5c34}
.addr{font-size:13px;color:#42536a;margin-top:10px;padding-top:10px;border-top:1px dashed #d7e2ec}
.pack{display:flex;justify-content:space-between;align-items:flex-start;width:100%;background:#fff;border:1.6px solid #dbe5ee;border-radius:12px;padding:14px 15px;margin-top:10px;font-family:inherit;font-size:15px;cursor:pointer;text-align:left}
.pack:active{border-color:#0d7a44;background:#f4fbf7}
.pack .pl{font-weight:700;font-size:16px}
.pack .pp{color:#0d5c34;font-weight:800;white-space:nowrap;margin-left:10px}
.pack .pwater{display:block;font-size:12px;color:#6b7c8f;font-weight:500;margin-top:3px}
.pack.cur{border-color:#0d7a44;background:#f4fbf7}
.tag{display:inline-block;font-size:11px;background:#0d7a44;color:#fff;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.ok{text-align:center;padding:26px 8px}
.ok .icon{font-size:44px;line-height:1}
.ok h2{margin:12px 0 6px;font-size:20px}
.ok p{margin:0;color:#5b6b7c;font-size:14px}
.spin{text-align:center;padding:40px;color:#7a8899}
.note{font-size:12px;color:#7a8899;text-align:center;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="top">
  <div class="brand">ALTIER CROP SCIENCE</div>
  <div class="sub">झम्म माइक्रो न्यूट्रिएंट</div>
</div>
<div class="wrap" id="app"><div class="spin">कृपया रुकें…</div></div>
<script>
var FN_URL = "https://oljqgaqgxypzvavimkye.supabase.co/functions/v1/order-confirm";
var tok = new URLSearchParams(location.search).get("t") || "";
var app = document.getElementById("app");
var state = { view: null };

function call(payload) {
  return fetch(FN_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(function (r) {
    if (!r.ok && r.status >= 500) throw new Error("HTTP " + r.status);
    return r.json();
  });
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function inr(n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); }
function packLabel(g) { return Number(g) === 1000 ? "1 किलो" : g + " ग्राम"; }
function screen(html) { app.innerHTML = html; }

function msgScreen(icon, title, text) {
  screen('<div class="card"><div class="ok"><div class="icon">' + icon + "</div><h2>" + esc(title) +
         "</h2><p>" + esc(text) + "</p></div></div><div class=\"note\">— Altier Crop Science</div>");
}

function mainView(v) {
  state.view = v;

  if (!v.can_change) {
    msgScreen("📦", "पैक नहीं बदल सकते",
      "आपका पार्सल पहले ही भेजा जा चुका है, इसलिए अब पैक नहीं बदला जा सकता। किसी भी सहायता के लिए हमें फोन करें।");
    return;
  }

  var html = '<div class="card">' +
    '<p class="hi">कौन सा पैक चाहिए?</p>' +
    '<p class="small">अभी आपका पैक: ' + esc(v.pack_label) + " · " + inr(v.amount) + "</p>" +
    '<div class="orderbox">' +
      '<div class="row"><span class="k">नाम</span><span class="v">' + esc(v.customer_name) + "</span></div>" +
      '<div class="row"><span class="k">ऑर्डर</span><span class="v" style="font-size:12px">' + esc(v.order_id) + "</span></div>" +
      '<div class="addr">📍 ' + esc(v.address) + "</div>" +
    "</div>";

  (v.packs || []).forEach(function (p) {
    var cur = Number(p.pack_grams) === Number(v.pack_grams);
    html += '<button class="pack' + (cur ? " cur" : "") + '" data-g="' + p.pack_grams + '">' +
              "<span><span class=\"pl\">" + esc(p.label) + "</span>" +
              (cur ? '<span class="tag">अभी यही</span>' : "") +
              (p.water ? '<span class="pwater">' + esc(p.water) + "</span>" : "") +
              "</span>" +
              '<span class="pp">' + inr(p.price) + "</span>" +
            "</button>";
  });

  html += "</div>" +
    '<div class="note">पैक चुनते ही आपका ऑर्डर उसी पैक का हो जाएगा।</div>';
  screen(html);

  Array.prototype.forEach.call(document.querySelectorAll(".pack"), function (b) {
    b.onclick = function () { doPack(Number(b.getAttribute("data-g"))); };
  });
}

function busy(text) { screen('<div class="spin">' + esc(text) + "</div>"); }

function reload() {
  call({ action: "view", token: tok }).then(function (v) {
    if (!v || !v.ok) { msgScreen("⚠️", "लिंक नहीं मिला", "यह लिंक सही नहीं है या पुराना हो गया है।"); return; }
    mainView(v);
  }).catch(function () { msgScreen("⚠️", "दिक्कत आ गई", "कृपया थोड़ी देर बाद फिर कोशिश करें।"); });
}

function doPack(g) {
  var v = state.view;
  if (Number(g) === Number(v.pack_grams)) {
    msgScreen("✅", "यही पैक पहले से है", "आपका ऑर्डर " + v.pack_label + " · " + inr(v.amount) + " का है।");
    return;
  }
  busy("पैक बदला जा रहा है…");
  call({ action: "pack", token: tok, grams: g }).then(function (r) {
    if (r && r.ok) {
      msgScreen("✅", "पैक बदल गया", "अब आपका ऑर्डर " + packLabel(r.pack_grams) + " · " + inr(r.amount) +
        " का हो गया है। अब WhatsApp में जाकर ऑर्डर की पुष्टि कर दीजिए।");
    } else if (r && r.reason === "already_booked") {
      msgScreen("📦", "पार्सल जा चुका है", "अब पैक नहीं बदला जा सकता।");
    } else {
      msgScreen("⚠️", "पैक नहीं बदला", "कृपया हमें फोन करें।");
    }
  }).catch(function () { msgScreen("⚠️", "दिक्कत आ गई", "कृपया थोड़ी देर बाद फिर कोशिश करें।"); });
}

if (!tok) {
  msgScreen("⚠️", "लिंक अधूरा है", "कृपया वही लिंक खोलें जो हमने संदेश में भेजा था।");
} else {
  reload();
}
</script>
</body>
</html>
