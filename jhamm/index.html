<body>
<!-- Google Tag Manager (noscript) --><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TJGXF2S8" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><!-- End Google Tag Manager (noscript) -->
<iframe id="shop" src="https://raw.githack.com/somdatt9754-png/altier-landing-page/shop-campaign-product-page/shop-pin.html?v=20260824-0921" title="JHAMM Shop"></iframe>
<button id="scVerifyTarget" class="sc-verify-target" type="button" aria-label="ऑर्डर करें" data-sharechat-event="Purchase">ऑर्डर करें</button>
<section id="scVerifyResult" class="sc-verify-result" aria-hidden="true">
  <div class="sc-verify-card">
    <div class="ok">✅</div>
    <h1>Purchase Verified</h1>
    <p>Successful order detected after form submission.</p>
    <div class="meta" id="scVerifyMeta">ShareChat Purchase event fired.</div>
  </div>
</section>
<script>
(function(){
  var frame=document.getElementById('shop'),
      target=document.getElementById('scVerifyTarget'),
      result=document.getElementById('scVerifyResult'),
      meta=document.getElementById('scVerifyMeta');

  var params=new URLSearchParams(window.location.search);
  var verifyMode = params.get('verify')==='true';

  if(verifyMode){
    target.style.display='block';
    console.log("[SHARECHAT] Verification/test mode active (?verify=true). Real Purchase is disabled in this mode.");
  }

  target.addEventListener('click', function(){
    console.log("[SHARECHAT] Order button clicked", {verifyMode: verifyMode});
    if(verifyMode){
      try{
        frame.contentWindow.postMessage({type:'ALTIER_MAPPING_TEST', event:'Purchase'}, '*');
        console.log("[SHARECHAT] Verification mapping-test message sent to iframe (no Purchase pixel call made)");
      }catch(e){
        console.log("[SHARECHAT] Verification postMessage failed", e);
      }
    }
  });

  window.addEventListener('message', function(e){
    var d = e && e.data;
    if(!d) return;
    if(d.type !== 'ALTIER_ORDER_SUCCESS' || !d.order) return;

    var o = d.order;

    if(verifyMode){
      // SAFEGUARD: verification/test mode must NEVER fire a live Purchase event.
      console.log("[SHARECHAT] Purchase blocked: verification/test mode", {order_id: o.order_id});
      target.style.display='none';
      meta.textContent='Verification mode: order flow mapping confirmed for order '+(o.order_id||'')+'. No live Purchase pixel event was fired (test/simulation only). Real Purchase events fire only from the production thank-you page after an actual order submission.';
      result.style.display='flex';
      result.setAttribute('aria-hidden','false');
      return;
    }

    // Production path: real order success received from iframe.
    console.log("[SHARECHAT] Order SUCCESS received from order form", {order_id: o.order_id, total_amount: o.total_amount});
    try{
      sessionStorage.setItem('jhammm_order_confirmation', JSON.stringify(o));
    }catch(err){
      console.log("[SHARECHAT] Could not persist order confirmation to sessionStorage", err);
    }
    console.log("[SHARECHAT] Redirecting to thank-you page for Purchase event", {order_id: o.order_id});
    window.location.href='/jhamm/thank-you.html';
  });
})();
</script>
