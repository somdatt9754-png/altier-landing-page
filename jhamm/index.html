<script>
(function(){
  // Only job of this script: when the order form (inside the iframe) confirms
  // a real successful order, redirect to the thank-you page. No pixel calls,
  // no ShareChat SDK, no dataLayer pushes — GTM handles all tracking itself
  // using its own triggers (e.g. a Page View trigger on the thank-you URL).
  var frame=document.getElementById('shop');

  window.addEventListener('message', function(e){
    var d = e && e.data;
    if(!d) return;
    if(d.type !== 'ALTIER_ORDER_SUCCESS' || !d.order) return;

    var o = d.order;
    try{
      sessionStorage.setItem('jhammm_order_confirmation', JSON.stringify(o));
    }catch(err){}
    window.location.href='/jhamm/thank-you.html';
  });
})();
</script>
