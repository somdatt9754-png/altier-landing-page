<style>html,body{margin:0;min-height:100%;background:#f5f8f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#172217}.wrap{min-height:100vh;padding:22px 14px;background:linear-gradient(180deg,#f5fbf6,#fff)}.box{width:min(92%,620px);margin:30px auto;background:#fff;border:1px solid #dfe8e1;border-radius:20px;box-shadow:0 12px 30px rgba(16,45,25,.08);padding:22px}.ok{font-size:54px;text-align:center}.box h1{margin:5px 0 8px;text-align:center;color:#075c2b;font-size:28px}.muted{color:#657066;text-align:center;font-size:13px;margin:0 0 18px}.details{border:1px solid #dfe8e1;border-radius:14px;padding:14px;background:#f8fbf8}.row{display:flex;justify-content:space-between;gap:16px;font-size:14px;margin:9px 0}.row b:last-child{text-align:right}.total{padding-top:10px;border-top:1px solid #dfe8e1;font-weight:900;font-size:18px;color:#075c2b}.next{margin-top:16px;padding:12px;border-radius:12px;background:#eef9f0;color:#176b39;text-align:center;font-size:13px}.small{margin-top:12px;font-size:11px;color:#657066;text-align:center}</style>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TJGXF2S8" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<main class="wrap">
  <section class="box">
    <div class="ok">✅</div>
    <h1>आपका ऑर्डर कन्फर्म हो गया</h1>
    <p class="muted">आपके ऑर्डर की जानकारी सफलतापूर्वक सेव हो गई है।</p>
    <div class="details">
      <div class="row"><span>Order ID</span><b id="cOrder">—</b></div>
      <div class="row"><span>Product</span><b id="cProduct">JHAMM Micro Nutrient</b></div>
      <div class="row"><span>Pack</span><b id="cPack">—</b></div>
      <div class="row"><span>Quantity</span><b id="cQty">—</b></div>
      <div class="row"><span>Payment</span><b id="cPay">—</b></div>
      <div class="row"><span>Delivery</span><b>FREE</b></div>
      <div class="row total"><span>Payable Amount</span><b id="cTotal">₹0</b></div>
      <div class="row"><span>नाम</span><b id="cName">—</b></div>
      <div class="row"><span>मोबाइल</span><b id="cPhone">—</b></div>
      <div class="row"><span>जिला</span><b id="cDistrict">—</b></div>
      <div class="row"><span>राज्य</span><b id="cState">—</b></div>
      <div class="row"><span>PIN Code</span><b id="cPin">—</b></div>
      <div class="row"><span>पता</span><b id="cAddress">—</b></div>
    </div>
    <div class="next">🚚 आपका पार्सल जल्द ही भेजा जाएगा।</div>
    <p class="small">Order details सुरक्षित रूप से दर्ज हो गई हैं।</p>
  </section>
</main>
<script>
(function(){
  function set(id,v){ var e=document.getElementById(id); if(e) e.textContent = (v==null ? '' : v); }
  function money(v){ return '₹'+Number(v||0).toLocaleString('en-IN'); }

  var o = null;
  try{
    o = JSON.parse(sessionStorage.getItem('jhammm_order_confirmation') || 'null');
  }catch(e){
    console.log("[SHARECHAT] Failed to read order confirmation from sessionStorage", e);
  }

  if(!o){
    // SAFEGUARD: no order data present. Do NOT push any purchase-related
    // dataLayer event. This blocks GTM's Page URL trigger from having
    // anything valid to key off if someone opens this URL directly.
    console.log("[SHARECHAT] Purchase blocked: no successful order (no order data found on thank-you page)");
    document.getElementById('cOrder').textContent = 'Order details unavailable';
    return;
  }

  set('cOrder', o.order_id);
  set('cProduct', o.product_name || 'JHAMM Micro Nutrient');
  set('cPack', o.pack_grams===1000 ? '1 किलो' : (o.pack_grams||0)+' ग्राम');
  set('cQty', o.quantity);
  set('cPay', o.payment_method==='cod' ? 'Cash on Delivery' : 'Online Payment');
  set('cTotal', money(o.total_amount));
  set('cName', o.customer_name);
  set('cPhone', o.phone);
  set('cDistrict', o.district);
  set('cState', o.state);
  set('cPin', o.pincode);
  set('cAddress', o.address_line);

  // ---- Single source of truth for Purchase: dataLayer push only. ----
  // ShareChat's GTM tag listens for this and fires the real pixel call.
  // We do NOT call window.scq('Purchase', ...) directly here anymore —
  // doing so alongside the GTM tag would double-fire the same conversion.

  var firedKey = 'jhammm_purchase_fired_' + String(o.order_id || '');
  var alreadyFired = false;
  try{
    alreadyFired = sessionStorage.getItem(firedKey) === '1';
  }catch(e){
    console.log("[SHARECHAT] Could not read dedup flag from sessionStorage", e);
  }

  if(alreadyFired){
    console.log("[SHARECHAT] Purchase blocked: dataLayer event already pushed for order_id=" + (o.order_id || 'unknown') + " (page refresh or revisit)");
    return;
  }

  console.log("[SHARECHAT] Order submission confirmed, pushing purchase dataLayer event", {order_id: o.order_id});

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'sharechat_purchase',          // <-- GTM Custom Event trigger should listen for this exact name
    order_id: o.order_id,
    value: Number(o.total_amount),
    currency: 'INR',
    content_name: o.product_name,
    pack_grams: o.pack_grams,
    quantity: Number(o.quantity),
    payment_method: o.payment_method
  });

  try{
    sessionStorage.setItem(firedKey, '1');
  }catch(e){
    console.log("[SHARECHAT] Could not persist dedup flag to sessionStorage", e);
  }

  console.log("[SHARECHAT] Purchase event firing (via GTM dataLayer)", {
    order_id: o.order_id,
    value: Number(o.total_amount),
    currency: 'INR'
  });
  console.log("[SHARECHAT] dataLayer event 'sharechat_purchase' pushed successfully for order_id=" + (o.order_id || 'unknown'));
})();
</script>
</body></html>
