<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JHAMM Shop</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="shop" src="https://raw.githack.com/somdatt9754-png/altier-landing-page/shop-campaign-product-page/shop.html" title="JHAMM Shop"></iframe><script>(function(){const f=document.getElementById('shop');function wire(){let d;try{d=f.contentDocument||f.contentWindow.document}catch(e){return};if(!d||!d.body)return;const pin=d.getElementById('pin'),state=d.getElementById('state');if(!pin||!state)return;if(d.getElementById('district')&&d.getElementById('postOffice'))return;const grid=state.closest('.grid2')||state.parentElement;const mk=(id,label)=>{const box=d.createElement('div');box.innerHTML='<label for="'+id+'">'+label+'</label><input id="'+id+'" type="text" readonly placeholder="PIN Code से अपने आप आएगा">';grid.appendChild(box);return box.querySelector('#'+id)};const district=d.getElementById('district')||mk('district','जिला');const post=d.getElementById('postOffice')||mk('postOffice','Post Office');grid.style.gridTemplateColumns='repeat(2,1fr)';let busy=false;pin.addEventListener('input',async()=>{const v=pin.value.replace(/\D/g,'').slice(0,6);pin.value=v;state.value='';district.value='';post.value='';if(v.length!==6||busy)return;busy=true;state.placeholder='PIN verify हो रहा है…';try{const r=await fetch('https://raw.githubusercontent.com/IndiaPost/pin/master/api/v01/json/'+v+'.json',{cache:'no-store'});if(!r.ok)throw new Error('not found');const rows=await r.json();if(!Array.isArray(rows)||!rows.length)throw new Error('not found');const delivery=rows.find(x=>x.Deliverystatus==='Delivery')||rows[0];state.value=delivery.statename||'';district.value=delivery.Districtname||'';post.value=delivery.officename||'';state.placeholder='PIN Code से अपने आप आएगा'}catch(e){state.value='PIN Code नहीं मिला';state.placeholder='PIN Code से अपने आप आएगा'}finally{busy=false}})}f.addEventListener('load',()=>setTimeout(wire,300));})();</script></body></html>
