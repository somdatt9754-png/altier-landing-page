name: Patch universal WhatsApp event

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add universal WhatsApp dataLayer event
        shell: python
        run: |
          from pathlib import Path
          p = Path("tracking.js")
          s = p.read_text(encoding="utf-8")
          marker = '    if (eventName) {\n      window.dataLayer.push({\n        event: eventName,'
          replacement = '''    // Universal WhatsApp click event for all crop pages.
    // Existing source-specific events are preserved unchanged.
    window.dataLayer.push({
      event: "altier_whatsapp_click",
      altier_source: source,
      visitor_id: visitorId,
      session_id: sessionId,
      tracking_token: trackingToken,
      crop: cropFromPage(),
      campaign: attribution.campaign,
      ad_set: attribution.ad_set,
      ad_name: attribution.ad_name
    });

    if (eventName) {
      window.dataLayer.push({
        event: eventName,'''
          if 'event: "altier_whatsapp_click"' not in s:
              if marker not in s:
                  raise SystemExit("Expected tracking.js marker not found; no change made")
              s = s.replace(marker, replacement, 1)
              p.write_text(s, encoding="utf-8")
          else:
              print("Universal event already present; no change needed")

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add universal WhatsApp click dataLayer event"
          git push
