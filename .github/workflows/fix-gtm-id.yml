name: Fix GTM container ID

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-gtm-id:
    if: github.event.head_commit.message != 'Fix GTM container ID to GTM-TJGXF2S8'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace incorrect GTM ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'GTM-TJQXF2S8'
          new = 'GTM-TJGXF2S8'
          if old not in s:
              raise SystemExit('Incorrect GTM ID not found in index.html')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit corrected GTM ID and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-gtm-id.yml
          git commit -m "Fix GTM container ID to GTM-TJGXF2S8"
          git push
