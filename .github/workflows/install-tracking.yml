name: Install ALTIER Tracking

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-tracking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shared tracking and GTM on crop pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tracking_marker = '<script src="tracking.js"></script>'
          gtm_head_marker = 'https://www.googletagmanager.com/gtm.js?id=GTM-TJGXF2S8'
          gtm_head = '''<!-- Google Tag Manager -->
          <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-TJGXF2S8');</script>
          <!-- End Google Tag Manager -->'''
          gtm_noscript_marker = 'https://www.googletagmanager.com/ns.html?id=GTM-TJGXF2S8'
          gtm_noscript = '''<!-- Google Tag Manager (noscript) -->
          <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TJGXF2S8"
          height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
          <!-- End Google Tag Manager (noscript) -->'''

          changed = []

          for path in Path('.').glob('*.html'):
              if path.name.lower() == 'index.html':
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              # Add GTM to every crop page so GTM can receive the existing
              # tracking.js dataLayer events such as altier_whatsapp_click.
              if gtm_head_marker not in text and '</head>' in text.lower():
                  idx = text.lower().rfind('</head>')
                  text = text[:idx] + '\n' + gtm_head + '\n' + text[idx:]

              if gtm_noscript_marker not in text and '<body' in text.lower():
                  body_start = text.lower().find('<body')
                  body_end = text.find('>', body_start)
                  if body_end != -1:
                      insert_at = body_end + 1
                      text = text[:insert_at] + '\n' + gtm_noscript + '\n' + text[insert_at:]

              if tracking_marker not in text and '</body>' in text.lower():
                  idx = text.lower().rfind('</body>')
                  text = text[:idx] + '\n  ' + tracking_marker + '\n' + text[idx:]

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit tracking installation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No HTML changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Install GTM on ALTIER crop pages"
          git push
