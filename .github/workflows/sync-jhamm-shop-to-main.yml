name: Sync JHAMM shop files to main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy campaign shop files and remove raw.githack links
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin shop-campaign-product-page
          git show origin/shop-campaign-product-page:shop-pin.html > shop-pin.html
          git show origin/shop-campaign-product-page:shop.html > shop.html
          python - <<'PY'
          from pathlib import Path
          index = Path('jhamm/index.html')
          text = index.read_text(encoding='utf-8')
          old = 'https://raw.githack.com/somdatt9754-png/altier-landing-page/shop-campaign-product-page/shop-pin.html?v=20260824-0921'
          if old not in text:
              raise SystemExit('Expected shop-pin URL was not found in jhamm/index.html')
          index.write_text(text.replace(old, '/shop-pin.html'), encoding='utf-8')
          pin = Path('shop-pin.html')
          text = pin.read_text(encoding='utf-8')
          old = 'https://raw.githack.com/somdatt9754-png/altier-landing-page/shop-campaign-product-page/shop.html?v=20260912-0001'
          if old not in text:
              raise SystemExit('Expected shop URL was not found in shop-pin.html')
          pin.write_text(text.replace(old, '/shop.html'), encoding='utf-8')
          PY
          if grep -R 'raw.githack.com/somdatt9754-png/altier-landing-page/shop-campaign-product-page' -n jhamm/index.html shop-pin.html shop.html; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jhamm/index.html shop-pin.html shop.html
          git commit -m 'Move JHAMM shop flow onto main domain'
          git push origin HEAD:main
